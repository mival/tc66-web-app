# Run the tests, then publish the page to GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Let a new deployment start only after the current one ends.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Unit tests
        run: node --test test/tc66.test.js test/db.test.js
      - name: End-to-end test
        run: BROWSER_PATH="$(command -v google-chrome)" node test/e2e.mjs

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Publish only the page files. Tests and notes stay out of the site.
      - name: Copy the page files
        run: |
          mkdir _site
          cp -r index.html battery.html manifest.webmanifest sw.js icon.svg css js _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
