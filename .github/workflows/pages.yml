# Run the tests, then publish the page to GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Let a new deployment start only after the current one ends.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Unit tests
        run: node --test test/tc66.test.js test/db.test.js
      - name: End-to-end test
        run: BROWSER_PATH="$(command -v google-chrome)" node test/e2e.mjs

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Publish only the page files. Tests and notes stay out of the site.
      - name: Copy the page files
        run: |
          mkdir _site
          cp -r index.html battery.html help.html manifest.webmanifest sw.js icon.svg version.json css js _site/
          [ -d img ] && cp -r img _site/ || true
      # Write the git commit and the date into the build.
      # The page shows the version. The service worker gets a new cache name.
      - name: Inject the build version
        run: |
          VERSION="${GITHUB_SHA::7}"
          DATE="$(date -u +%Y-%m-%d)"
          printf "window.APP_VERSION = { commit: '%s', date: '%s' };\n" "$VERSION" "$DATE" > _site/js/version.js
          printf '{ "commit": "%s", "date": "%s" }\n' "$VERSION" "$DATE" > _site/version.json
          sed -i "s/const CACHE_VERSION = '[^']*';/const CACHE_VERSION = 'tc66-$VERSION';/" _site/sw.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
